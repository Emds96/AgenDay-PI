name: Deploy to InfinityFree

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: Deploy to InfinityFree FTP
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Criar conexao.php para producao
        env:
          DB_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          php -r '
          $pass = addslashes(getenv("DB_PASS"));
          $content = "<?php\n" .
                     "define(\"HOST\", \"sql208.byetcluster.com\");\n" .
                     "define(\"USUARIO\", \"if0_43406270\");\n" .
                     "define(\"SENHA\", \"$pass\");\n" .
                     "define(\"DB\", \"if0_43406270_agenday\");\n\n" .
                     "try {\n" .
                     "    \$conexao = mysqli_connect(HOST, USUARIO, SENHA, DB);\n" .
                     "} catch (Throwable \$e) {\n" .
                     "    die(\"Erro ao conectar ao banco de dados: \" . \$e->getMessage());\n" .
                     "}\n\n" .
                     "if (!\$conexao) {\n" .
                     "    die(\"Nao conectado: \" . mysqli_connect_error());\n" .
                     "}\n";
          file_put_contents("conexao.php", $content);
          '

      - name: Sync FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: htdocs/
