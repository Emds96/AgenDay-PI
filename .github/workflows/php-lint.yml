name: PHP syntax check

on:
  push:
    branches:
      - dev-feira-uninorte
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Check PHP runtime
        run: php --version
      - name: Lint all PHP files
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name '*.php' -not -path './.git/*' -print0 | xargs -0 -r -n1 php -l
